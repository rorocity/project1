<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 3D 탐구 주사위</title>
  <!-- 안정적인 CDN 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r124/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #2c3e50, #0f172a);
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .header-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 16px 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 10;
    }
    .header-panel h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      font-weight: 800;
      color: #f8fafc;
    }
    .header-panel p {
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .bottom-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .instruction {
      font-size: 0.9rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
    }
    .btn-action {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #ffffff;
      color: #1e293b;
      padding: 28px;
      border-radius: 24px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      font-size: 1.3rem;
      color: #0f172a;
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
    }
    .rule-item {
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 4px solid #3b82f6;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="header-panel">
    <h1>🎲 탐구 주사위</h1>
    <p>주사위를 마우스나 손가락으로 굴리며 <b>숨겨진 규칙</b>을 발견해 보세요!</p>
  </div>
