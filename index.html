<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 3D 탐구 주사위</title>
  <!-- Three.js 기본 엔진 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #2c3e50, #0f172a);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .header-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 14px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .header-panel h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      font-weight: 800;
    }
    .header-panel p {
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .bottom-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .instruction {
      font-size: 0.85rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.7);
      padding: 5px 14px;
      border-radius: 15px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .btn-reload {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #ffffff;
      color: #1e293b;
      padding: 24px;
      border-radius: 20px;
      max-width: 420px;
      width: 90%;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .modal-header h2 {
      font-size: 1.25rem;
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #64748b;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rule-item {
      background: #f8fafc;
      padding: 9px 12px;
      border-radius: 10px;
      border-left: 4px solid #3b82f6;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="header-panel">
    <h1>🎲 탐구 주사위</h1>
    <p>주사위를 마우스나 터치로 돌려보며 <b>숨겨진 규칙</b>을 찾아보세요!</p>
  </div>

  <div class="bottom-panel">
    <div class="instruction">화면을 드래그하여 주사위를 회전시킬 수 있습니다</div>
    <div class="btn-group">
      <button class="btn-action" onclick="openModal()">🔍 4번 면(가려진 면) 정답 확인</button>
      <button class="btn-action btn-reload" onclick="location.reload()">🔄 새로운 문제 뽑기</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🎉 숨겨진 규칙 & 4번 면 정답</h2>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    // --- 1. 무작위 규칙 데이터 ---
    const topLeftRules = [
      { getVal: (n) => n * 10, desc: '10씩 커짐 (10, 20, 30...)' },
      { getVal: (n) => n * 5, desc: '5씩 커짐 (5, 10, 15...)' },
      { getVal: (n) => Math.pow(2, n), desc: '앞 수의 2배씩 커짐 (2, 4, 8...)' },
      { getVal: (n) => n * 100, desc: '100씩 커짐 (100, 200, 300...)' }
    ];

    const topRightRules = [
      { getVal: (n) => ['자', '연', '보', '호', '실', '천'][n - 1], desc: "'자연보호실천' 글자 순서" },
      { getVal: (n) => ['생', '태', '전', '환', '교', '육'][n - 1], desc: "'생태전환교육' 글자 순서" },
      { getVal: (n) => ['봄', '여', '름', '가', '을', '겨'][n - 1], desc: "'봄여름가을겨' 순서" },
      { getVal: (n) => (n % 2 === 1 ? 'A' : 'B'), desc: 'A와 B가 번갈아 반복' }
    ];

    const bottomLeftRules = [
      { getVal: (n) => ['○', '△', '□', '⬠', '⬡', '★'][n - 1], desc: '변의 수가 늘어나는 도형' },
      { getVal: (n) => ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ'][n - 1], desc: '한글 자음 순서 (ㄱ, ㄴ, ㄷ...)' },
      { getVal: (n) => ['ㄱ', 'ㅗ', 'ㅏ', 'ㅎ', 'ㅏ', 'ㄱ'][n - 1], desc: "'과학' 낱자 순서 (ㄱ, ㅗ, ㅏ, ㅎ...)" },
      { getVal: (n) => ['↑', '→', '↓', '←', '↑', '→'][n - 1], desc: '시계 방향으로 90도 회전하는 화살표' }
    ];

    const bottomRightRules = [
      { getVal: (n) => n * 2, desc: '2의 배수 (가운데 숫자의 2배)' },
      { getVal: (n) => n * 3, desc: '3의 배수 (구구단 3단)' },
      { getVal: (n) => n * 4, desc: '4의 배수 (구구단 4단)' },
      { getVal: (n) => 10 - n, desc: '합이 10이 되는 짝꿍수' }
    ];

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const tlRule = pick(topLeftRules);
    const trRule = pick(topRightRules);
    const blRule = pick(bottomLeftRules);
    const brRule = pick(bottomRightRules);
    const hiddenFaceNum = 4;

    const diceFaces = [];
    for (let i = 1; i <= 6; i++) {
      diceFaces.push({
        num: i,
        center: String(i),
        tl: String(tlRule.getVal(i)),
        tr: String(trRule.getVal(i)),
        bl: String(blRule.getVal(i)),
        br: String(brRule.getVal(i)),
        isSecret: (i === hiddenFaceNum)
      });
    }

    document.getElementById('modal-body').innerHTML = `
      <div class="rule-item"><b>가운데:</b> 4 (주사위 번호 순서)</div>
      <div class="rule-item"><b>왼쪽 위:</b> ${tlRule.getVal(4)} (${tlRule.desc})</div>
      <div class="rule-item"><b>오른쪽 위:</b> ${trRule.getVal(4)} (${trRule.desc})</div>
      <div class="rule-item"><b>왼쪽 아래:</b> ${blRule.getVal(4)} (${blRule.desc})</div>
      <div class="rule-item"><b>오른쪽 아래:</b> ${brRule.getVal(4)} (${brRule.desc})</div>
    `;

    // --- 2. 텍스처 생성 (2D Canvas) ---
    function createFaceTexture(faceData) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      if (faceData.isSecret) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, 512, 512);
        ctx.lineWidth = 16;
        ctx.strokeStyle = '#0f172a';
        ctx.strokeRect(8, 8, 496, 496);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < 512; i += 32) {
          ctx.fillRect(i, 0, 16, 512);
        }

        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 220px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 256, 256);
        return new THREE.CanvasTexture(canvas);
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 512);

      ctx.lineWidth = 16;
      ctx.strokeStyle = '#cbd5e1';
      ctx.strokeRect(8, 8, 496, 496);

      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 190px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(faceData.center, 256, 256);

      ctx.font = 'bold 64px sans-serif';
      ctx.fillStyle = '#15803d';
      ctx.textAlign = 'left';
      ctx.fillText(faceData.tl, 48, 90);

      ctx.fillStyle = '#2563eb';
      ctx.textAlign = 'right';
      ctx.fillText(faceData.tr, 464, 90);

      ctx.fillStyle = '#1e3a8a';
      ctx.textAlign = 'left';
      ctx.fillText(faceData.bl, 48, 450);

      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'right';
      ctx.fillText(faceData.br, 464, 450);

      return new THREE.CanvasTexture(canvas);
    }

    // --- 3. Three.js 씬 초기화 & 내장 드래그 회전 구현 ---
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 0, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const materials = [
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[0]), roughness: 0.3 }), // 1번 (+X)
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[5]), roughness: 0.3 }), // 6번 (-X)
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[1]), roughness: 0.3 }), // 2번 (+Y)
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[4]), roughness: 0.3 }), // 5번 (-Y)
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[2]), roughness: 0.3 }), // 3번 (+Z)
      new THREE.MeshStandardMaterial({ map: createFaceTexture(diceFaces[3]), roughness: 0.3 })  // 4번 (-Z, 물음표)
    ];

    const geometry = new THREE.BoxGeometry(2.3, 2.3, 2.3);
    const cube = new THREE.Mesh(geometry, materials);
    cube.rotation.x = 0.5;
    cube.rotation.y = 0.6;
    scene.add(cube);

    // 마우스 및 터치 드래그 회전 로직
    let isDragging = false;
    let prevMousePos = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      prevMousePos = {
        x: e.touches ? e.touches[0].clientX : e.clientX,
        y: e.touches ? e.touches[0].clientY : e.clientY
      };
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = currentX - prevMousePos.x;
      const deltaY = currentY - prevMousePos.y;

      cube.rotation.y += deltaX * 0.01;
      cube.rotation.x += deltaY * 0.01;

      prevMousePos = { x: currentX, y: currentY };
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        cube.rotation.y += 0.002;
      }
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function openModal() {
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
