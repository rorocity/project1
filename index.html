<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단일 파일 계산기</title>
    <style>
        /* CSS: 스타일링 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #eee;
            border: none;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 2em;
            text-align: right;
            box-sizing: border-box;
            border-radius: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .button {
            width: 100%;
            height: 60px;
            font-size: 1.5em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #555;
            color: white;
        }
        .button:hover {
            background-color: #777;
        }
        .operator {
            background-color: #ff9500;
        }
        .operator:hover {
            background-color: #ffa520;
        }
        .clear {
            background-color: #d9534f;
        }
        .clear:hover {
            background-color: #e06c68;
        }
        .equals {
            grid-column: span 2; /* = 버튼을 두 칸 차지하게 만듭니다. */
            background-color: #4CAF50;
        }
        .equals:hover {
            background-color: #62a365;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled value="0">

        <div class="buttons">
            <button class="button clear" onclick="clearDisplay()">AC</button>
            <button class="button operator" onclick="appendOperation('/')">/</button>
            <button class="button operator" onclick="appendOperation('*')">*</button>
            
            <button class="button" onclick="appendToDisplay('7')">7</button>
            <button class="button" onclick="appendToDisplay('8')">8</button>
            <button class="button" onclick="appendToDisplay('9')">9</button>
            <button class="button operator" onclick="appendOperation('-')">-</button>

            <button class="button" onclick="appendToDisplay('4')">4</button>
            <button class="button" onclick="appendToDisplay('5')">5</button>
            <button class="button" onclick="appendToDisplay('6')">6</button>
            <button class="button operator" onclick="appendOperation('+')">+</button>

            <button class="button" onclick="appendToDisplay('1')">1</button>
            <button class="button" onclick="appendToDisplay('2')">2</button>
            <button class="button" onclick="appendToDisplay('3')">3</button>
            <button class="button" onclick="calculateResult()">=</button>

            <button class="button" onclick="appendToDisplay('0')">0</button>
            <button class="button" onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <script>
        // JavaScript: 계산 로직
        const display = document.getElementById('display');
        let currentInput = '0';
        let operator = null;
        let previousValue = null;
        let waitingForNewValue = false;

        function updateDisplay() {
            display.value = currentInput;
        }

        // 숫자와 소수점 입력 함수
        function appendToDisplay(value) {
            if (currentInput === '0' || waitingForNewValue) {
                currentInput = value === '.' ? '0.' : value;
                waitingForNewValue = false;
            } else if (value === '.' && currentInput.includes('.')) {
                return; // 소수점 중복 방지
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        // 연산자 입력 함수
        function appendOperation(nextOperator) {
            const inputValue = parseFloat(currentInput);

            if (previousValue === null) {
                previousValue = inputValue;
            } else if (!waitingForNewValue) {
                // 이전 계산이 완료되지 않았다면 결과를 먼저 계산합니다.
                calculate();
            }

            operator = nextOperator;
            waitingForNewValue = true;
            currentInput = previousValue.toString();
            updateDisplay();
        }

        // 사칙연산 수행 로직 (계산 결과를 previousValue에 저장)
        function calculate() {
            const inputValue = parseFloat(currentInput);
            if (previousValue === null || operator === null) return;

            let result;
            switch (operator) {
                case '+':
                    result = previousValue + inputValue;
                    break;
                case '-':
                    result = previousValue - inputValue;
                    break;
                case '*':
                    result = previousValue * inputValue;
                    break;
                case '/':
                    if (inputValue === 0) {
                        alert("0으로 나눌 수 없습니다.");
                        clearDisplay();
                        return;
                    }
                    result = previousValue / inputValue;
                    break;
                default:
                    return;
            }
            // 소수점 처리 (최대 10자리)
            previousValue = parseFloat(result.toFixed(10));
        }

        // '=' 버튼 클릭 함수
        function calculateResult() {
            if (operator === null || waitingForNewValue) return;

            calculate();
            currentInput = previousValue.toString();
            operator = null;
            previousValue = null;
            waitingForNewValue = true; // 다음 입력 시 새롭게 시작
            updateDisplay();
        }

        // 'AC' (전체 삭제) 버튼 함수
        function clearDisplay() {
            currentInput = '0';
            operator = null;
            previousValue = null;
            waitingForNewValue = false;
            updateDisplay();
        }

        // 페이지 로드 시 초기 표시
        updateDisplay(); 
    </script>

</body>
</html>
