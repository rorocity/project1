<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 3D 탐구 주사위</title>
  <!-- Three.js 및 마우스 궤도 컨트롤 라이브러리 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #2c3e50, #0f172a);
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* 상단 안내 패널 */
    .header-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 16px 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      pointer-events: none;
    }
    .header-panel h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      font-weight: 800;
      color: #f8fafc;
    }
    .header-panel p {
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    /* 하단 조작 안내 및 정답 확인 버튼 */
    .bottom-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .instruction {
      font-size: 0.9rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 16px;
      border-radius: 20px;
    }
    .btn-action {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6);
    }
    /* 정답 모달창 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #ffffff;
      color: #1e293b;
      padding: 30px;
      border-radius: 24px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .modal-header h2 {
      font-size: 1.4rem;
      color: #0f172a;
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      line-height: 1.6;
      font-size: 1rem;
    }
    .rule-item {
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 4px solid #3b82f6;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="header-panel">
    <h1>🎲 탐구 주사위</h1>
    <p>주사위를 마우스나 손가락으로 굴리며 <b>숨겨진 규칙</b>을 발견해 보세요!</p>
  </div>

  <div class="bottom-panel">
    <div class="instruction">화면을 드래그하여 주사위를 자유롭게 회전시켜 보세요</div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-action" onclick="openModal()">🔍 4번 면(가려진 면) 정답 확인</button>
      <button class="btn-action" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="location.reload()">🔄 새로운 문제 뽑기</button>
    </div>
  </div>

  <!-- 정답 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🎉 숨겨진 규칙 & 4번 면 정답</h2>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- 규칙 설명이 동적으로 들어옵니다 -->
      </div>
    </div>
  </div>
